<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewsPulse - 24h Curated News</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar for a clean UI */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black text-lg tracking-wider shadow-sm">
          N
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">NewsPulse</h1>
          <p class="text-[11px] text-slate-500 font-medium">Live 24-Hour Curated Headlines</p>
        </div>
      </div>
      <div class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
        AI-Powered Summaries
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow">
    
    <!-- Topic / Category Selection Bar -->
    <section class="mb-6">
      <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
        <!-- Standard Categories -->
        <button class="cat-btn active bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:opacity-90" data-type="category" data-val="general">
          Top Stories
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="category" data-val="technology">
          Technology
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="category" data-val="business">
          Business
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="category" data-val="sports">
          Sports
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="category" data-val="science">
          Science
        </button>

        <!-- Entertainment & Regional Cinema Topics -->
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="topic" data-val="bollywood">
          Bollywood
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="topic" data-val="tollywood">
          Tollywood
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="topic" data-val="hollywood">
          Hollywood
        </button>
        <button class="cat-btn bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition shadow-xs hover:bg-slate-100" data-type="topic" data-val="cricket">
          Cricket
        </button>
      </div>
    </section>

    <!-- News Feed Grid -->
    <section id="newsFeed" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading indicator initially rendered by app.js -->
      <div class="col-span-full text-center py-16 text-slate-400">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-3"></div>
        <p class="text-sm font-medium">Fetching the latest headlines...</p>
      </div>
    </section>

  </main>

  <!-- Article Details Modal -->
  <div id="articleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 relative max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100">
      
      <!-- Close Button -->
      <button id="closeModalBtn" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition">
        ✕
      </button>
      
      <!-- Modal Header & Image -->
      <img id="modalImage" class="w-full h-52 object-cover rounded-xl mb-4 bg-slate-100" src="" alt="News Headline" />
      <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-slate-900 leading-snug mb-3"></h2>
      
      <!-- AI Summary Container (No "TL;DR" heading) -->
      <div class="bg-blue-50/80 border border-blue-200 rounded-xl p-4 my-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-blue-900 uppercase tracking-wider">Key Highlights</span>
          <span id="summaryStatus" class="bg-blue-600 text-white text-[11px] px-2.5 py-0.5 rounded-full font-medium">Summarizing...</span>
        </div>
        <div id="summaryContent" class="text-sm text-slate-700 space-y-1.5 leading-relaxed font-normal">
          <p class="italic text-slate-500">Generating 3-bullet recap...</p>
        </div>
      </div>

      <!-- Description / Snippet -->
      <p id="modalDescription" class="text-sm text-slate-600 mb-6 leading-relaxed"></p>
      
      <!-- External Source Link -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
        <a id="modalSourceLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs font-semibold text-blue-600 hover:text-blue-800 transition">
          Read full article at source <span class="ml-1">→</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Link your app logic script -->
  <script src="/app.js"></script>
</body>
</html>
